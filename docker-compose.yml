services:

  # ── Ollama (LLM + embedding server) ────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0   # makes API reachable across the Docker network
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    tty: true                  # allocates pseudo-TTY → ollama pull works without errors
    restart: unless-stopped
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags | grep -q 'qwen3.5' && curl -sf http://localhost:11434/api/tags | grep -q 'qwen3-embedding'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - rag-network

  # ── Qdrant (vector DB) ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz 2>/dev/null | grep -q 'ok\\|true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag-network

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://ollama:11434
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  ollama_data:
  qdrant_data:

networks:
  rag-network:
    driver: bridge
